spring.application.name=chatMantisBT

# --- Configuración de Redis (Redis Cloud / Upstash) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# Lettuce pool (Optimizado para planes free)
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}

# Redis repositories
spring.data.redis.repositories.enabled=${REDIS_REPOSITORIES_ENABLED:false}

# --- Supabase PostgreSQL Configuration ---
# Ojo: Asegúrate de que la URL de Supabase en Render empiece con jdbc:postgresql://
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.postgresql.Driver}

# --- JPA/Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Puerto para Render ---
server.port=${PORT:8080}
